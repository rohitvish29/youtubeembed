<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definite Success Custom Player</title>
    <style>
        body { 
            margin: 0; 
            background-color: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 700px;
            max-width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .video-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        /* --- NEW: Floating Logo Styling --- */
        .brand-logo {
            position: absolute;
            top: 20px;
            right: 25px; /* Adjust this to move it left or right */
            width: 140px; /* Adjust this to make your logo bigger or smaller */
            opacity: 0.85; /* Makes it slightly transparent */
            z-index: 20; /* Keeps it above the video player */
            pointer-events: none; /* Physically prevents clicks on the logo */
            transition: opacity 0.3s ease;
        }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden; 
        }

        .video-container:fullscreen .iframe-wrapper {
            flex-grow: 1;
            padding-bottom: 0;
            height: auto;
        }

        #player {
            position: absolute;
            top: -80px;  
            left: 0;
            width: 100%;
            height: calc(100% + 160px); 
            pointer-events: none; 
        }

        .custom-controls {
            display: flex;
            align-items: center;
            background: #222;
            padding: 10px 15px;
            gap: 15px;
            z-index: 10;
        }

        .control-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .control-btn:hover {
            background: #b20710;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
        }

        .time-display {
            color: white;
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }

        .speed-control {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .speed-control:hover {
            background: #444;
        }
    </style>
</head>
<body>

    <div class="video-container" id="video-container">
        
        <!-- NEW: Your Floating Logo -->
        <!-- Replace the src link with the actual URL of your transparent PNG logo -->
        <img src="https://via.placeholder.com/150x50?text=Your+Logo+Here" alt="Definite Success Classes" class="brand-logo" id="brand-logo">

        <div class="iframe-wrapper">
            <div id="player"></div>
        </div>
        
        <div class="custom-controls">
            <button id="play-pause-btn" class="control-btn">Play</button>
            <input type="range" id="progress-bar" class="progress-bar" value="0" step="0.1" min="0" max="100">
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            
            <select id="speed-control" class="speed-control">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>

            <button id="fullscreen-btn" class="control-btn">Full</button>
        </div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var timeUpdater;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'yWgHx0HE8m8',
                playerVars: { 
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            var progressBar = document.getElementById('progress-bar');
            var speedControl = document.getElementById('speed-control');
            var fullscreenBtn = document.getElementById('fullscreen-btn');
            var videoContainer = document.getElementById('video-container');
            
            document.getElementById('total-time').innerText = formatTime(player.getDuration());
            progressBar.max = player.getDuration();

            playPauseBtn.addEventListener('click', function() {
                var state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });

            progressBar.addEventListener('input', function() {
                player.seekTo(progressBar.value, true);
            });

            speedControl.addEventListener('change', function() {
                player.setPlaybackRate(parseFloat(this.value));
            });

            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (document.fullscreenElement) {
                    fullscreenBtn.innerText = "Exit";
                } else {
                    fullscreenBtn.innerText = "Full";
                }
            });
        }

        function onPlayerStateChange(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseBtn.innerText = "Pause";
                timeUpdater = setInterval(updateProgressBar, 500);
            } else {
                playPauseBtn.innerText = "Play";
                clearInterval(timeUpdater);
            }

            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.pauseVideo();
            }
        }

        function updateProgressBar() {
            var currentTime = player.getCurrentTime();
            document.getElementById('progress-bar').value = currentTime;
            document.getElementById('current-time').innerText = formatTime(currentTime);
        }

        function formatTime(time) {
            var minutes = Math.floor(time / 60);
            var seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }
    </script>
</body>
</html>

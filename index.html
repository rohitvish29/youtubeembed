<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Definite Success Mobile Player</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            padding: 0;
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            min-height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            transition: transform 0.3s ease;
        }

        /* NATIVE FULLSCREEN */
        .video-container:fullscreen, .video-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        /* KIOSK / WEBVIEW CSS OVERRIDE FULLSCREEN */
        .video-container.kiosk-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100dvh;
            max-width: none;
            border-radius: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }

        /* iOS FORCED LANDSCAPE ROTATION FALLBACK */
        @media screen and (orientation: portrait) {
            .video-container.kiosk-fullscreen {
                width: 100dvh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: top left;
                left: 100vw;
            }
        }

        /* UI FADE ANIMATIONS (For Control Bar & Back Button) */
        .autohide-ui {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .autohide-ui.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 40; 
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* FLOATING LOGO (Now Permanent with transparency) */
        .brand-logo {
            position: absolute;
            top: max(5px, env(safe-area-inset-top));
            right: max(5px, env(safe-area-inset-right));
            width: 110px;
            max-width: 25vw;
            z-index: 30;
            pointer-events: none;
            opacity: 0.85; /* Normal visibility */
            transition: opacity 0.3s ease; /* Smooth fade effect */
        }
        
        /* 80% Transparent state when controls hide */
        .brand-logo.dimmed {
            opacity: 0.2; 
        }

        /* VIDEO AREA */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden; 
            background: #000;
        }

        .video-container:fullscreen .iframe-wrapper,
        .video-container:-webkit-full-screen .iframe-wrapper,
        .video-container.kiosk-fullscreen .iframe-wrapper {
            flex-grow: 1;
            padding-bottom: 0;
            height: auto;
        }

        #player {
            position: absolute;
            top: -80px;  
            left: 0;
            width: 100%;
            height: calc(100% + 160px); 
            pointer-events: none; 
        }

        /* INVISIBLE TOUCH LAYER */
        #touch-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            cursor: pointer;
        }

        /* CONTROL BAR */
        .custom-controls {
            display: flex;
            align-items: center;
            background: #181818;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            gap: 12px;
            z-index: 40;
        }

        /* FULLSCREEN OVERLAY FIX */
        .video-container:fullscreen .custom-controls,
        .video-container:-webkit-full-screen .custom-controls,
        .video-container.kiosk-fullscreen .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(24, 24, 24, 0.85); 
        }

        .control-btn {
            background: #e50914;
            color: white;
            border: none;
            min-width: 44px;
            height: 38px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            cursor: pointer;
            accent-color: #e50914;
        }

        .time-display {
            color: #ccc;
            font-size: 13px;
            min-width: 75px;
            text-align: center;
        }

        .speed-control {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            height: 38px;
            padding: 0 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* MOBILE FIX: TWO-ROW CONTROL BAR */
        @media (max-width: 600px) {
            .video-container { border-radius: 0; }
            .brand-logo { width: 90px; }
            
            .custom-controls { 
                flex-wrap: wrap; 
                padding: 10px; 
                gap: 8px; 
            }
            
            .progress-bar { 
                flex: 1 1 100%; 
                order: -1;      
                margin-bottom: 5px;
                width: 100%;
            }
            
            .time-display { 
                flex-grow: 1; 
                text-align: left; 
                font-size: 12px; 
                padding-left: 5px;
            }

            .speed-control { font-size: 12px; padding: 0 4px; }
            .control-btn { font-size: 13px; padding: 0 8px; }
        }
    </style>
</head>
<body>

    <div class="video-container" id="video-container">
        
        <button class="back-btn autohide-ui" id="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>

        <img src="logo.png" alt="Logo" class="brand-logo" id="brand-logo" onerror="this.style.display='none'">

        <div class="iframe-wrapper">
            <div id="player"></div>
            <div id="touch-overlay"></div>
        </div>
        
        <div class="custom-controls autohide-ui">
            <button id="play-pause-btn" class="control-btn">Play</button>
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            
            <input type="range" id="progress-bar" class="progress-bar" value="0" step="0.1" min="0" max="100">
            
            <select id="speed-control" class="speed-control">
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>

            <button id="fullscreen-btn" class="control-btn">Full</button>
        </div>
    </div>

    <script>
        // 1. Load API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player, timeUpdater, idleTimer;
        var isUIHidden = false; 
        var uiElements = document.querySelectorAll('.autohide-ui');
        var brandLogo = document.getElementById('brand-logo'); // Target the logo specifically

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'yWgHx0HE8m8',
                playerVars: { 
                    'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'playsinline': 1,
                    'origin': window.location.origin
                },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        // 2. Setup Interactions
        function onPlayerReady(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            var touchOverlay = document.getElementById('touch-overlay');
            var progressBar = document.getElementById('progress-bar');
            var speedControl = document.getElementById('speed-control');
            var fullscreenBtn = document.getElementById('fullscreen-btn');
            var backBtn = document.getElementById('back-btn');
            var videoContainer = document.getElementById('video-container');
            
            document.getElementById('total-time').innerText = formatTime(player.getDuration());
            progressBar.max = player.getDuration();

            function togglePlay() {
                if (player && typeof player.getPlayerState === 'function') {
                    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    } else {
                        player.playVideo();
                    }
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);
            
            touchOverlay.addEventListener('click', function() {
                if (isUIHidden) {
                    showUI();
                    resetIdleTimer();
                } else {
                    togglePlay();
                    resetIdleTimer();
                }
            });

            progressBar.addEventListener('input', function() { player.seekTo(progressBar.value, true); });
            speedControl.addEventListener('change', function() { player.setPlaybackRate(parseFloat(this.value)); });

            backBtn.addEventListener('click', function() {
                if (document.fullscreenElement || document.webkitFullscreenElement || videoContainer.classList.contains('kiosk-fullscreen')) {
                    exitFullscreen();
                }
                
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = "https://google.com"; 
                }
            });

            // --- ORIENTATION LOCK FUNCTIONS ---
            function lockLandscape() {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(error) {
                        console.log("Orientation lock not supported or blocked by browser.");
                    });
                }
            }

            function unlockOrientation() {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }

            function exitFullscreen() {
                unlockOrientation(); 
                
                // Attempt native exit
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(e => console.log(e));
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                
                // Always remove the CSS fallback class
                videoContainer.classList.remove('kiosk-fullscreen');
                fullscreenBtn.innerText = "Full";
            }

            // KIOSK-SAFE FULLSCREEN LOGIC
            fullscreenBtn.addEventListener('click', function() {
                var isCurrentlyFullscreen = document.fullscreenElement || document.webkitFullscreenElement || videoContainer.classList.contains('kiosk-fullscreen');

                if (!isCurrentlyFullscreen) {
                    // Try native fullscreen first
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen()
                            .then(lockLandscape)
                            .catch(function() {
                                // If native fails (Kiosk block), force CSS fullscreen
                                videoContainer.classList.add('kiosk-fullscreen');
                                lockLandscape();
                                fullscreenBtn.innerText = "Exit";
                            });
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                        lockLandscape();
                        // Assume success but add fallback class just in case WebKit fails silently
                        videoContainer.classList.add('kiosk-fullscreen');
                    } else {
                        // Native API not found at all, use CSS fallback
                        videoContainer.classList.add('kiosk-fullscreen');
                        lockLandscape();
                        fullscreenBtn.innerText = "Exit";
                    }
                } else {
                    exitFullscreen();
                }
            });

            var handleFSChange = function() {
                var isNativeFS = document.fullscreenElement || document.webkitFullscreenElement;
                
                // Only change button to "Full" if we are neither in native FS NOR in CSS fallback FS
                if (!isNativeFS && !videoContainer.classList.contains('kiosk-fullscreen')) {
                    fullscreenBtn.innerText = "Full";
                    unlockOrientation();
                } else {
                    fullscreenBtn.innerText = "Exit";
                }
            };
            
            document.addEventListener('fullscreenchange', handleFSChange);
            document.addEventListener('webkitfullscreenchange', handleFSChange);

            document.querySelector('.custom-controls').addEventListener('touchstart', resetIdleTimer, {passive: true});
            document.querySelector('.custom-controls').addEventListener('mousemove', resetIdleTimer);
            
            resetIdleTimer();
        }

        // 3. UI Show/Hide Logic
        function showUI() {
            uiElements.forEach(el => el.classList.remove('hidden'));
            if(brandLogo) brandLogo.classList.remove('dimmed'); // Restore full logo opacity
            isUIHidden = false;
        }

        function resetIdleTimer() {
            showUI();
            clearTimeout(idleTimer);
            
            if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === YT.PlayerState.PLAYING) {
                idleTimer = setTimeout(() => {
                    uiElements.forEach(el => el.classList.add('hidden'));
                    if(brandLogo) brandLogo.classList.add('dimmed'); // Apply 80% transparency to the logo
                    isUIHidden = true;
                }, 3500); 
            }
        }

        function onPlayerStateChange(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseBtn.innerText = "Pause";
                resetIdleTimer(); 
                timeUpdater = setInterval(updateProgressBar, 500);
            } else {
                playPauseBtn.innerText = "Play";
                showUI(); 
                clearTimeout(idleTimer); 
                clearInterval(timeUpdater);
            }

            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.pauseVideo();
            }
        }

        function updateProgressBar() {
            if (player && typeof player.getCurrentTime === 'function') {
                document.getElementById('progress-bar').value = player.getCurrentTime();
                document.getElementById('current-time').innerText = formatTime(player.getCurrentTime());
            }
        }

        function formatTime(time) {
            var minutes = Math.floor(time / 60);
            var seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }
    </script>
</body>
</html>

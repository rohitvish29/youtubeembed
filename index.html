<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Video Player</title>
    <style>
        /* Centers the video and makes the background black */
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: 'yWgHx0HE8m8', // Put your video ID here
                playerVars: { 
                    'rel': 0, 
                    'playsinline': 1 
                },
                events: { 
                    'onStateChange': onPlayerStateChange 
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.pauseVideo();
            }
        }
    </script>
</body>
</html>

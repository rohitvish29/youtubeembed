<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Definite Success Mobile Player</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            padding: 0;
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Container scales fluidly across desktop, tablet, and mobile */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        /* Fullscreen handling for mobile & desktop */
        .video-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        /* iOS WebKit Fullscreen support */
        .video-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        /* --- BACK BUTTON (TOP-LEFT FOR iOS & ANDROID) --- */
        .back-btn {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 30;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background 0.2s, transform 0.2s;
        }

        .back-btn:active {
            transform: scale(0.92);
            background: rgba(229, 9, 20, 0.8);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* --- FLOATING LOGO (TOP-RIGHT) --- */
        .brand-logo {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            width: 110px;
            max-width: 25vw;
            opacity: 0.85;
            z-index: 20;
            pointer-events: none;
        }

        /* Aspect ratio wrapper */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden; 
            background: #000;
        }

        .video-container:fullscreen .iframe-wrapper,
        .video-container:-webkit-full-screen .iframe-wrapper {
            flex-grow: 1;
            padding-bottom: 0;
            height: auto;
        }

        /* YouTube crop & click-blocking shield */
        #player {
            position: absolute;
            top: -80px;  
            left: 0;
            width: 100%;
            height: calc(100% + 160px); 
            pointer-events: none; 
        }

        /* Custom mobile-friendly control bar */
        .custom-controls {
            display: flex;
            align-items: center;
            background: #181818;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            gap: 12px;
            z-index: 25;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #e50914;
            color: white;
            border: none;
            min-width: 44px;
            height: 38px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            background: #b20710;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            cursor: pointer;
            accent-color: #e50914;
        }

        .time-display {
            color: #ccc;
            font-size: 13px;
            min-width: 75px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .speed-control {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            height: 38px;
            padding: 0 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .video-container {
                border-radius: 0;
            }
            .custom-controls {
                padding: 8px 10px;
                gap: 8px;
            }
            .brand-logo {
                width: 90px;
            }
            .time-display {
                font-size: 11px;
                min-width: 65px;
            }
            .speed-control {
                padding: 0 4px;
                font-size: 12px;
            }
            .control-btn {
                padding: 0 8px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="video-container" id="video-container">
        
        <button class="back-btn" id="back-btn" aria-label="Exit Video">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>

        <img src="my-logo.png" alt="Definite Success" class="brand-logo" id="brand-logo" onerror="this.style.display='none'">

        <div class="iframe-wrapper">
            <div id="player"></div>
        </div>
        
        <div class="custom-controls">
            <button id="play-pause-btn" class="control-btn">Play</button>
            <input type="range" id="progress-bar" class="progress-bar" value="0" step="0.1" min="0" max="100">
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            
            <select id="speed-control" class="speed-control">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>

            <button id="fullscreen-btn" class="control-btn">Full</button>
        </div>
    </div>

    <script>
        // 1. YouTube API Initialization
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var timeUpdater;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'yWgHx0HE8m8',
                playerVars: { 
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'playsinline': 1 /* Keeps video inside web view on iPhones */
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 2. Setup Event Listeners
        function onPlayerReady(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            var progressBar = document.getElementById('progress-bar');
            var speedControl = document.getElementById('speed-control');
            var fullscreenBtn = document.getElementById('fullscreen-btn');
            var backBtn = document.getElementById('back-btn');
            var videoContainer = document.getElementById('video-container');
            
            document.getElementById('total-time').innerText = formatTime(player.getDuration());
            progressBar.max = player.getDuration();

            // Play / Pause toggle
            playPauseBtn.addEventListener('click', function() {
                var state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });

            // Seekbar scrub
            progressBar.addEventListener('input', function() {
                player.seekTo(progressBar.value, true);
            });

            // Speed select
            speedControl.addEventListener('change', function() {
                player.setPlaybackRate(parseFloat(this.value));
            });

            // Back Button Handler (Exit/Back functionality)
            backBtn.addEventListener('click', function() {
                // If in fullscreen, exit fullscreen first
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
                
                // Return to previous page in browser history or close window
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            });

            // Fullscreen cross-platform handler
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) { /* Safari & iOS */
                        videoContainer.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) { /* Safari & iOS */
                        document.webkitExitFullscreen();
                    }
                }
            });

            // Fullscreen text updater
            var handleFSChange = function() {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    fullscreenBtn.innerText = "Exit";
                } else {
                    fullscreenBtn.innerText = "Full";
                }
            };

            document.addEventListener('fullscreenchange', handleFSChange);
            document.addEventListener('webkitfullscreenchange', handleFSChange);
        }

        function onPlayerStateChange(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseBtn.innerText = "Pause";
                timeUpdater = setInterval(updateProgressBar, 500);
            } else {
                playPauseBtn.innerText = "Play";
                clearInterval(timeUpdater);
            }

            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.pauseVideo();
            }
        }

        function updateProgressBar() {
            var currentTime = player.getCurrentTime();
            document.getElementById('progress-bar').value = currentTime;
            document.getElementById('current-time').innerText = formatTime(currentTime);
        }

        function formatTime(time) {
            var minutes = Math.floor(time / 60);
            var seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Definite Success Mobile Player</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            padding: 0;
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            /* 100dvh perfectly centers on mobile, ignoring the URL bar */
            min-height: 100vh;
            min-height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        /* NATIVE FULLSCREEN */
        .video-container:fullscreen, .video-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        /* iOS CSS OVERRIDE FULLSCREEN */
        .video-container.ios-fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            max-width: none;
            border-radius: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        /* UI FADE ANIMATIONS */
        .autohide-ui {
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .autohide-ui.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 30;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* FLOATING LOGO */
        .brand-logo {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            width: 110px;
            max-width: 25vw;
            z-index: 30;
            pointer-events: none;
        }

        /* VIDEO AREA */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden; 
            background: #000;
        }

        .video-container:fullscreen .iframe-wrapper,
        .video-container:-webkit-full-screen .iframe-wrapper,
        .video-container.ios-fullscreen .iframe-wrapper {
            flex-grow: 1;
            padding-bottom: 0;
            height: auto;
        }

        #player {
            position: absolute;
            top: -80px;  
            left: 0;
            width: 100%;
            height: calc(100% + 160px); 
            pointer-events: none; 
        }

        /* INVISIBLE TOUCH LAYER (FOR TAP TO PLAY/PAUSE) */
        #touch-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            cursor: pointer;
        }

        /* CONTROL BAR */
        .custom-controls {
            display: flex;
            align-items: center;
            background: #181818;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            gap: 12px;
            z-index: 30;
        }

        .control-btn {
            background: #e50914;
            color: white;
            border: none;
            min-width: 44px;
            height: 38px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            cursor: pointer;
            accent-color: #e50914;
        }

        .time-display {
            color: #ccc;
            font-size: 13px;
            min-width: 75px;
            text-align: center;
        }

        .speed-control {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            height: 38px;
            padding: 0 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .video-container { border-radius: 0; }
            .custom-controls { padding: 8px 10px; gap: 8px; }
            .brand-logo { width: 90px; }
            .time-display { font-size: 11px; min-width: 65px; }
            .speed-control { padding: 0 4px; font-size: 12px; }
            .control-btn { padding: 0 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="video-container" id="video-container">
        
        <button class="back-btn autohide-ui" id="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>

        <img src="my-logo.png" alt="Logo" class="brand-logo autohide-ui" onerror="this.style.display='none'">

        <div class="iframe-wrapper">
            <div id="player"></div>
            <div id="touch-overlay"></div>
        </div>
        
        <div class="custom-controls autohide-ui">
            <button id="play-pause-btn" class="control-btn">Play</button>
            <input type="range" id="progress-bar" class="progress-bar" value="0" step="0.1" min="0" max="100">
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            
            <select id="speed-control" class="speed-control">
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>

            <button id="fullscreen-btn" class="control-btn">Full</button>
        </div>
    </div>

    <script>
        // 1. Load API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player, timeUpdater, idleTimer;
        var uiElements = document.querySelectorAll('.autohide-ui');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'yWgHx0HE8m8',
                playerVars: { 
                    'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'playsinline': 1 
                },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        // 2. Setup Interactions
        function onPlayerReady(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            var touchOverlay = document.getElementById('touch-overlay');
            var progressBar = document.getElementById('progress-bar');
            var speedControl = document.getElementById('speed-control');
            var fullscreenBtn = document.getElementById('fullscreen-btn');
            var backBtn = document.getElementById('back-btn');
            var videoContainer = document.getElementById('video-container');
            
            document.getElementById('total-time').innerText = formatTime(player.getDuration());
            progressBar.max = player.getDuration();

            // Toggle Play/Pause Function
            function togglePlay() {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);
            touchOverlay.addEventListener('click', function() {
                togglePlay();
                resetIdleTimer(); // Wake up UI when touched
            });

            progressBar.addEventListener('input', function() { player.seekTo(progressBar.value, true); });
            speedControl.addEventListener('change', function() { player.setPlaybackRate(parseFloat(this.value)); });

            // Back Button Logic
            backBtn.addEventListener('click', function() {
                if (document.fullscreenElement || document.webkitFullscreenElement || videoContainer.classList.contains('ios-fullscreen')) {
                    exitFullscreen();
                }
                
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // Fallback if there is no back history
                    window.location.href = "https://google.com"; // Change to your app's home link
                }
            });

            // Smart Fullscreen Logic
            function exitFullscreen() {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                videoContainer.classList.remove('ios-fullscreen');
                fullscreenBtn.innerText = "Full";
            }

            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement && !videoContainer.classList.contains('ios-fullscreen')) {
                    // Enter Fullscreen
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    } else {
                        // iOS Fallback Fullscreen
                        videoContainer.classList.add('ios-fullscreen');
                        fullscreenBtn.innerText = "Exit";
                    }
                } else {
                    exitFullscreen();
                }
            });

            // Fullscreen label updater
            var handleFSChange = function() {
                fullscreenBtn.innerText = (document.fullscreenElement || document.webkitFullscreenElement) ? "Exit" : "Full";
            };
            document.addEventListener('fullscreenchange', handleFSChange);
            document.addEventListener('webkitfullscreenchange', handleFSChange);

            // Wake up UI on any interaction
            document.addEventListener('mousemove', resetIdleTimer);
            document.addEventListener('touchstart', resetIdleTimer);
            
            resetIdleTimer(); // Start timer on load
        }

        // 3. Auto-Hide UI Timer Logic
        function resetIdleTimer() {
            // Show all UI
            uiElements.forEach(el => el.classList.remove('hidden'));
            clearTimeout(idleTimer);
            
            // Only hide UI automatically if video is actively playing
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                idleTimer = setTimeout(() => {
                    uiElements.forEach(el => el.classList.add('hidden'));
                }, 3000); // Hides after 3 seconds
            }
        }

        function onPlayerStateChange(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            resetIdleTimer(); // Wake up UI on state change
            
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseBtn.innerText = "Pause";
                timeUpdater = setInterval(updateProgressBar, 500);
            } else {
                playPauseBtn.innerText = "Play";
                clearInterval(timeUpdater);
            }

            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.pauseVideo();
            }
        }

        function updateProgressBar() {
            document.getElementById('progress-bar').value = player.getCurrentTime();
            document.getElementById('current-time').innerText = formatTime(player.getCurrentTime());
        }

        function formatTime(time) {
            var minutes = Math.floor(time / 60);
            var seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }
    </script>
</body>
</html>
